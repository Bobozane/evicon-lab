scenario_id = "wvs7-english-protocol-blind-v2-test-scenario-001"
title = "Synthetic public information-retention decision"
description = "An original English confirmatory-test scenario for protocol comparison. It is synthetic, not a WVS item, and does not describe a real organization or event."
initial_context = "A fictional public information service is deciding how long to retain routine access logs used to improve service reliability. Option A keeps detailed logs for a longer period to support troubleshooting. Option B deletes detailed logs quickly and retains only coarse summaries. Option C keeps detailed logs for a short, publicly stated window with independent deletion checks. Each participant must give a provisional recommendation, distinguish factual claims from value preferences, state uncertainties, and name evidence that could change the recommendation."
max_rounds = 2

