decision_options = ["A: retain detailed logs longer", "B: delete detailed logs quickly", "C: short retention with independent deletion checks"]
intended_output = ["provisional recommendation", "value-versus-fact distinction", "uncertainty", "evidence update condition"]
development_scenario_id = "wvs7-english-baseline-scenario"

